<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>小黑板</title>
<style>
  :root {
    --board: #22332c;
    --board-edge: #16211c;
    --chalk: #f2f6f1;
    --chalk-dim: #a9bdb1;
    --chalk-accent: #ffe9a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.05), transparent 45%),
      radial-gradient(circle at 80% 90%, rgba(255,255,255,.04), transparent 40%),
      var(--board-edge);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px 14px 40px;
    font-family: "Kaiti SC", "STKaiti", KaiTi, "楷体", "Songti SC", Georgia, serif;
    color: var(--chalk);
  }
  .frame {
    width: 100%;
    max-width: 720px;
    background: var(--board);
    border: 14px solid #6b4b2a;
    border-radius: 10px;
    box-shadow: 0 18px 40px rgba(0,0,0,.5), inset 0 0 90px rgba(0,0,0,.45);
    padding: 22px 22px 18px;
    position: relative;
  }
  .frame::after {
    content: "";
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 2px, transparent 2px 4px);
    pointer-events: none;
  }
  h1 {
    margin: 0 0 2px;
    font-size: 26px;
    letter-spacing: 4px;
    font-weight: 500;
    text-shadow: 0 0 6px rgba(255,255,255,.25);
  }
  .sub {
    color: var(--chalk-dim);
    font-size: 13px;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .rule { height: 1px; background: rgba(255,255,255,.18); margin: 12px 0 16px; }
  #log { min-height: 120px; max-height: 52vh; overflow-y: auto; }
  .msg { margin: 0 0 14px; line-height: 1.65; }
  .meta {
    color: var(--chalk-dim);
    font-size: 13px;
    letter-spacing: .5px;
    font-family: ui-monospace, Consolas, monospace;
  }
  .who { color: var(--chalk-accent); }
  .text { white-space: pre-wrap; word-break: break-word; font-size: 17px; text-shadow: 0 0 5px rgba(255,255,255,.12); }
  .mention { color: var(--chalk-accent); font-weight: 600; }
  .reply-action { border: 0; background: none; color: var(--chalk-dim); padding: 0 0 0 8px; font: inherit; cursor: pointer; }
  .quote { margin-top: 6px; padding: 7px 9px; border-left: 3px solid rgba(255,255,255,.24); background: rgba(0,0,0,.12); color: var(--chalk-dim); font-size: 13px; cursor: pointer; }
  .quote .quote-who { color: var(--chalk-accent); }
  .msg.flash { animation: quote-flash 1.2s ease-out; }
  @keyframes quote-flash { from { background: rgba(255,233,168,.22); } to { background: transparent; } }
  .empty { color: var(--chalk-dim); font-size: 16px; }
  .unread-summary { margin: 0 0 10px; padding: 7px 10px; border-radius: 6px; background: rgba(255,233,168,.12); color: var(--chalk-accent); font-size: 13px; cursor: pointer; }
  .unread-summary[hidden] { display: none; }
  .unread-divider { margin: 10px 0 14px; color: var(--chalk-accent); font-size: 12px; text-align: center; }
  .search-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .search-bar input, .search-bar button { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.22); border-radius: 6px; color: var(--chalk); font-family: inherit; padding: 6px 9px; }
  .search-bar input[type=search] { flex: 1; min-width: 150px; }
  .search-bar button { cursor: pointer; }
  .pager {
    margin-top: 16px; padding-top: 12px;
    border-top: 1px dashed rgba(255,255,255,.18);
    display: flex; align-items: center; justify-content: center; gap: 12px;
    color: var(--chalk-dim); font-size: 13px;
  }
  .pager button {
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.22);
    border-radius: 6px; color: var(--chalk); font-family: inherit;
    padding: 6px 12px; cursor: pointer;
  }
  .pager button:disabled { opacity: .35; cursor: default; }
  .new-message {
    position: fixed; right: 18px; bottom: 18px; z-index: 20;
    border: 1px solid rgba(255,233,168,.65); border-radius: 18px;
    background: #31483e; color: var(--chalk-accent); box-shadow: 0 4px 16px rgba(0,0,0,.35);
    font-family: inherit; font-size: 14px; padding: 8px 14px; cursor: pointer;
  }
  .new-message[hidden] { display: none; }
  .foot {
    margin-top: 18px; padding-top: 10px;
    border-top: 1px dashed rgba(255,255,255,.18);
    color: var(--chalk-dim); font-size: 12.5px; line-height: 1.7;
    display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: space-between;
  }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #7fd39a; margin-right: 6px; vertical-align: middle; }
  .dot.bad { background: #e2795f; }
  a { color: var(--chalk-dim); }

  /* 写作区 */
  .compose {
    margin-top: 16px; padding-top: 14px;
    border-top: 1px dashed rgba(255,255,255,.18);
    position: relative;
  }
  .compose .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .compose input[type=text], .compose textarea {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 6px;
    color: var(--chalk);
    font-family: inherit;
    font-size: 16px;
    padding: 8px 10px;
    outline: none;
  }
  .compose input[type=text] { width: 150px; }
  .compose input[type=text]::placeholder, .compose textarea::placeholder { color: #8fa79a; }
  .compose textarea {
    width: 100%; margin-top: 8px; resize: vertical; min-height: 62px;
    line-height: 1.6;
  }
  .compose input:focus, .compose textarea:focus { border-color: rgba(255,233,168,.6); }
  .compose button {
    background: rgba(255,233,168,.14);
    border: 1px solid rgba(255,233,168,.5);
    border-radius: 6px;
    color: var(--chalk-accent);
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 2px;
    padding: 8px 18px;
    cursor: pointer;
  }
  .compose button:disabled { opacity: .45; cursor: default; }
  .compose .hint { color: var(--chalk-dim); font-size: 12.5px; }
  .compose .hint.bad { color: #e2795f; }
  .identity strong { color: var(--chalk-accent); font-weight: normal; }
  .identity button { padding: 5px 10px; font-size: 13px; letter-spacing: 0; }
  .identity[hidden], .name-editor[hidden] { display: none; }
  .replying { margin-top: 8px; padding: 7px 9px; border-left: 3px solid rgba(255,255,255,.24); background: rgba(0,0,0,.12); color: var(--chalk-dim); font-size: 13px; }
  .replying button { float: right; border: 0; background: none; padding: 0; color: var(--chalk-dim); font-size: 13px; }
  .replying[hidden] { display: none; }
  .mention-menu {
    margin-top: 6px; padding: 6px; display: flex; flex-wrap: wrap; gap: 6px;
    border: 1px solid rgba(255,255,255,.18); border-radius: 6px;
    background: rgba(0,0,0,.16);
  }
  .mention-menu[hidden] { display: none; }
  .mention-menu button {
    padding: 4px 8px; font-size: 13px; letter-spacing: 0;
  }
  @media (max-width: 480px) {
    .frame { border-width: 10px; padding: 16px 14px 14px; }
    h1 { font-size: 22px; letter-spacing: 3px; }
    .text { font-size: 16px; }
    .compose input[type=text] { width: 100%; }
    .compose button { width: 100%; }
  }
</style>
</head>
<body>
  <div class="frame">
    <h1>小 黑 板</h1>
    <div class="sub">几个人共用的一张纸 · 写名字就能说 · 每 10 秒自己刷一遍</div>
    <div class="rule"></div>
    <div class="search-bar">
      <input id="searchKeyword" type="search" placeholder="搜索发言人或内容">
      <input id="searchDate" type="date" aria-label="按日期搜索">
      <button id="search" type="button">搜索</button>
      <button id="resetSearch" type="button">返回最新</button>
    </div>
    <div id="unreadSummary" class="unread-summary" hidden></div>
    <div id="log"><div class="empty">正在看黑板…</div></div>
    <div class="pager">
      <button id="newer" type="button">上一页（更新）</button>
      <span id="pageInfo">第 1 页</span>
      <button id="older" type="button">下一页（更早）</button>
    </div>

    <div class="compose">
      <div class="row identity" id="identity" hidden>
        <span>你是：<strong id="currentName"></strong></span>
        <button id="changeName" type="button">修改名字</button>
      </div>
      <div class="row name-editor" id="nameEditor">
        <input id="who" type="text" maxlength="20" placeholder="你的名字">
        <button id="saveName" type="button">开始聊天</button>
        <button id="cancelName" type="button" hidden>取消</button>
        <span class="hint" id="nameHint">第一次来，请先留下你的名字</span>
      </div>
      <div id="replying" class="replying" hidden><button id="cancelReply" type="button">取消</button><span id="replyingText"></span></div>
      <textarea id="say" maxlength="2000" placeholder="说点什么…（Enter 发送 / Shift+Enter 换行）" disabled></textarea>
      <div id="mentionMenu" class="mention-menu" hidden></div>
      <div class="row" style="margin-top:8px">
        <button id="send">写上去</button>
        <span class="hint" id="sendState"></span>
      </div>
    </div>

    <div class="foot">
      <span id="status"><span class="dot bad" id="dot"></span>连接中</span>
      <span id="seen"></span>
    </div>
    <button id="newMessage" class="new-message" type="button" hidden>↓ 有新消息</button>
  </div>

<script>
(function () {
  "use strict";

  // 页面和 MCP 在同一个站点上：直接向正门发 POST，不额外暴露任何数据文件。
  var MCP_URL = new URL("../mcp", window.location.href).href;
  var REFRESH_MS = 10000;
  var NAME_KEY = "blackboard-name";
  var READ_KEY = "blackboard-last-read";
  var DRAFT_KEY = "blackboard-draft";

  var sessionId = null;
  var currentPage = 1;
  var totalPages = 1;
  var knownNames = [];
  var rendered = false;
  var lastMessageId = 0;
  var forceBottom = true;
  var replyTo = 0;
  var messageCache = {};
  var searchKeyword = "";
  var searchDate = "";

  function $(id) { return document.getElementById(id); }

  function setStatus(ok, text) {
    $("status").innerHTML =
      '<span class="dot' + (ok ? '' : ' bad') + '"></span>' + text;
  }

  function setHint(text, bad) {
    var h = $("sendState");
    h.textContent = text || "";
    h.className = bad ? "hint bad" : "hint";
  }

  function savedName() {
    try { return (localStorage.getItem(NAME_KEY) || "").trim().slice(0, 20); }
    catch (e) { return ""; }
  }

  function savedReadId() {
    try {
      var value = localStorage.getItem(READ_KEY);
      return value === null ? null : Math.max(0, Number(value) || 0);
    } catch (e) { return null; }
  }

  function saveReadId(id) {
    try { localStorage.setItem(READ_KEY, String(Math.max(0, Number(id) || 0))); }
    catch (e) {}
  }

  function showUnreadSummary(count, mentioned) {
    var summary = $("unreadSummary");
    if (!count) { summary.hidden = true; return; }
    summary.textContent = "本页 " + count + " 条新消息" + (mentioned ? " · " + mentioned + " 条 @你" : "");
    summary.hidden = false;
  }

  function saveDraft() {
    try {
      var text = $("say").value;
      if (text) localStorage.setItem(DRAFT_KEY, text);
      else localStorage.removeItem(DRAFT_KEY);
    } catch (e) {}
  }

  function restoreDraft() {
    try { $("say").value = localStorage.getItem(DRAFT_KEY) || ""; }
    catch (e) {}
  }

  function showIdentity(name) {
    $("currentName").textContent = name;
    $("identity").hidden = false;
    $("nameEditor").hidden = true;
    $("say").disabled = false;
  }

  function editIdentity() {
    var name = savedName();
    $("who").value = name;
    $("saveName").textContent = name ? "保存名字" : "开始聊天";
    $("cancelName").hidden = !name;
    $("nameHint").textContent = name ? "修改后只影响今后的发言" : "第一次来，请先留下你的名字";
    $("identity").hidden = true;
    $("nameEditor").hidden = false;
    $("say").disabled = true;
    $("who").focus();
  }

  function saveIdentity() {
    var name = ($("who").value || "").trim().slice(0, 20);
    if (!name) {
      $("nameHint").textContent = "名字不能为空";
      $("nameHint").className = "hint bad";
      $("who").focus();
      return;
    }
    try { localStorage.setItem(NAME_KEY, name); }
    catch (e) {
      $("nameHint").textContent = "浏览器无法保存名字";
      $("nameHint").className = "hint bad";
      return;
    }
    $("nameHint").className = "hint";
    showIdentity(name);
    $("say").focus();
  }

  function beginReply(id) {
    var message = messageCache[id];
    if (!message) return;
    replyTo = Number(id);
    $("replyingText").textContent = "回复 " + message.name + "：" + message.text.slice(0, 80);
    $("replying").hidden = false;
    $("say").focus();
  }

  function clearReply() {
    replyTo = 0;
    $("replying").hidden = true;
    $("replyingText").textContent = "";
  }

  function isSearching() { return !!(searchKeyword || searchDate); }

  function applySearch() {
    searchKeyword = ($("searchKeyword").value || "").trim();
    searchDate = $("searchDate").value || "";
    currentPage = 1;
    forceBottom = true;
    refresh();
  }

  function clearSearch() {
    searchKeyword = "";
    searchDate = "";
    $("searchKeyword").value = "";
    $("searchDate").value = "";
    currentPage = 1;
    forceBottom = true;
    hideNewMessage();
    refresh();
  }

  // 极简 SSE 读取：MCP streamable-http 用 "event: message\ndata: {json}" 返回
  function parsePayload(raw) {
    var lines = raw.split(/\r?\n/);
    var out = null;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (line.indexOf("data:") === 0) {
        var chunk = line.slice(5).trim();
        if (!chunk) continue;
        try {
          var obj = JSON.parse(chunk);
          if (obj && (obj.result || obj.error)) out = obj;
        } catch (e) { /* 半截数据，跳过 */ }
      }
    }
    if (out) return out;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  function rpc(method, params) {
    var headers = {
      "content-type": "application/json",
      "accept": "application/json, text/event-stream"
    };
    if (sessionId) headers["mcp-session-id"] = sessionId;
    return fetch(MCP_URL, {
      method: "POST",
      headers: headers,
      body: JSON.stringify({ jsonrpc: "2.0", id: Date.now() % 100000, method: method, params: params || {} })
    }).then(function (res) {
      var sid = res.headers.get("mcp-session-id");
      if (sid) sessionId = sid;
      return res.text();
    }).then(parsePayload);
  }

  function ensureSession() {
    if (sessionId) return Promise.resolve();
    return rpc("initialize", {
      protocolVersion: "2025-06-18",
      capabilities: {},
      clientInfo: { name: "blackboard", version: "1" }
    });
  }

  function textOf(result) {
    if (!result) return "";
    if (Array.isArray(result.content)) {
      return result.content.map(function (c) { return c && c.text ? c.text : ""; }).join("\n");
    }
    return typeof result === "string" ? result : JSON.stringify(result);
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function escapeRegExp(s) {
    return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function setKnownNames(seenLine) {
    var raw = seenLine.replace(/^在座过的[：:]\s*/, "");
    knownNames = raw && raw !== "还没人" ? raw.split("、").filter(Boolean) : [];
  }

  function mentionPattern(name) {
    return new RegExp("@" + escapeRegExp(name) + "(?=$|\\s|[，。！？、,!.?:：；;）)])");
  }

  function mentionsIn(text) {
    return knownNames.filter(function (name) { return mentionPattern(name).test(text); });
  }

  function mentionHtml(text) {
    var names = knownNames.slice().sort(function (a, b) { return b.length - a.length; });
    if (!names.length) return esc(text);
    var pattern = new RegExp("@(?:" + names.map(escapeRegExp).join("|") + ")(?=$|\\s|[，。！？、,!.?:：；;）)])", "g");
    var html = "", last = 0, match;
    while ((match = pattern.exec(String(text))) !== null) {
      html += esc(String(text).slice(last, match.index));
      html += '<span class="mention">' + esc(match[0]) + '</span>';
      last = match.index + match[0].length;
    }
    return html + esc(String(text).slice(last));
  }

  function mentionContext() {
    var say = $("say"), caret = say.selectionStart;
    var match = say.value.slice(0, caret).match(/@([^@\s]*)$/);
    if (!match) return null;
    return { start: caret - match[0].length, end: caret, query: match[1] };
  }

  function chooseMention(name) {
    var say = $("say"), context = mentionContext();
    if (!context) return;
    say.value = say.value.slice(0, context.start) + "@" + name + " " + say.value.slice(context.end);
    var caret = context.start + name.length + 2;
    say.setSelectionRange(caret, caret);
    $("mentionMenu").hidden = true;
    say.focus();
  }

  function updateMentionMenu() {
    var menu = $("mentionMenu"), context = mentionContext();
    var matches = context ? knownNames.filter(function (name) {
      return name.toLocaleLowerCase().indexOf(context.query.toLocaleLowerCase()) === 0;
    }) : [];
    menu.innerHTML = "";
    matches.forEach(function (name) {
      var button = document.createElement("button");
      button.type = "button";
      button.textContent = "@" + name;
      button.addEventListener("mousedown", function (event) {
        event.preventDefault();
        chooseMention(name);
      });
      menu.appendChild(button);
    });
    menu.hidden = !matches.length;
  }

  function isAtBottom() {
    var log = $("log");
    return log.scrollHeight - log.scrollTop - log.clientHeight <= 24;
  }

  function captureScrollAnchor() {
    var log = $("log");
    if (!rendered || forceBottom || isAtBottom()) return { bottom: true };
    var logTop = log.getBoundingClientRect().top;
    var messages = log.querySelectorAll(".msg");
    for (var i = 0; i < messages.length; i++) {
      var rect = messages[i].getBoundingClientRect();
      if (rect.bottom > logTop) {
        return {
          bottom: false,
          id: messages[i].getAttribute("data-id"),
          offset: rect.top - logTop,
          scrollTop: log.scrollTop
        };
      }
    }
    return { bottom: false, scrollTop: log.scrollTop };
  }

  function restoreScroll(anchor) {
    var log = $("log");
    if (anchor.bottom || forceBottom) {
      log.scrollTop = log.scrollHeight;
      return;
    }
    log.scrollTop = anchor.scrollTop;
    var target = anchor.id ? log.querySelector('.msg[data-id="' + anchor.id + '"]') : null;
    if (target) {
      var currentOffset = target.getBoundingClientRect().top - log.getBoundingClientRect().top;
      log.scrollTop += currentOffset - anchor.offset;
    }
  }

  function showNewMessage(text) {
    var button = $("newMessage");
    button.textContent = text || "↓ 有新消息";
    button.hidden = false;
  }

  function hideNewMessage() {
    $("newMessage").hidden = true;
  }

  function render(text) {
    var log = $("log");
    var lines = String(text).split(/\r?\n/);
    var seenLine = "";
    var historyLine = "";
    var html = "";
    var current = "";
    var count = 0;
    var newestId = 0;
    var readId = savedReadId();
    var unread = 0;
    var mentionedUnread = 0;
    var unreadStarted = false;
    var ownName = savedName();
    messageCache = {};
    function flushMessage() { if (current) { html += current + "</div>"; current = ""; } }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].replace(/\s+$/, "");
      if (!line) continue;
      if (line.indexOf("历史：") === 0) { historyLine = line; continue; }
      if (line.indexOf("在座过的") === 0) { seenLine = line; setKnownNames(line); continue; }
      var m = line.match(/^\[(\d+)\]\s+(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}|\S+)\s+([^：:]+)[：:]([\s\S]*)$/);
      var q = line.match(/^↪ 引用 \[(\d+)\]\s+([^：:]+)[：:]([\s\S]*)$/);
      if (m) {
        flushMessage();
        count++;
        var messageId = Number(m[1]);
        var mentionedMe = m[3].indexOf("（@你）") !== -1;
        var authorName = m[3].replace("（@你）", "");
        var isUnread = currentPage === 1 && !isSearching() && readId !== null && messageId > readId && authorName !== ownName;
        newestId = Math.max(newestId, messageId);
        if (isUnread) {
          unread++;
          if (mentionedMe) mentionedUnread++;
          if (!unreadStarted) {
            html += '<div class="unread-divider">以下是新消息</div>';
            unreadStarted = true;
          }
        }
        messageCache[m[1]] = { name: authorName, text: m[4] };
        current = '<div class="msg" data-id="' + esc(m[1]) + '"><div class="meta">#' + esc(m[1]) + ' · ' + esc(m[2]) + ' · <span class="who">' + esc(m[3]) + '</span><button class="reply-action" type="button" data-reply="' + esc(m[1]) + '">回复</button></div>'
              + '<div class="text">' + mentionHtml(m[4]) + '</div>';
      } else if (q && current) {
        current += '<div class="quote" data-quote="' + esc(q[1]) + '"><span class="quote-who">' + esc(q[2]) + '：</span>' + mentionHtml(q[3]) + '</div>';
      } else if (current) {
        current += '<div class="text">' + mentionHtml(line) + '</div>';
      } else {
        html += '<div class="empty">' + esc(line) + '</div>';
      }
    }
    flushMessage();

    log.innerHTML = html || '<div class="empty">黑板上还什么都没有。</div>';
    $("seen").textContent = seenLine ? seenLine.replace(/^在座过的[：:]\s*/, "来过的人：") : "";
    var pageMatch = historyLine.match(/第\s+(\d+)\/(\d+)\s+页\s+·\s+共\s+(\d+)\s+条/);
    return {
      count: count,
      page: pageMatch ? Number(pageMatch[1]) : currentPage,
      totalPages: pageMatch ? Number(pageMatch[2]) : 1,
      total: pageMatch ? Number(pageMatch[3]) : count,
      newestId: newestId,
      unread: unread,
      mentionedUnread: mentionedUnread
    };
  }

  function updatePager(info) {
    currentPage = info.page;
    totalPages = info.totalPages;
    $("pageInfo").textContent = "第 " + currentPage + " / " + totalPages + " 页";
    $("newer").disabled = currentPage <= 1;
    $("older").disabled = currentPage >= totalPages;
  }

  function refresh() {
    var anchor = captureScrollAnchor();
    var previousLastId = lastMessageId;
    ensureSession()
      .then(function () { return rpc("tools/call", { name: "room_history", arguments: { page: currentPage, keyword: searchKeyword, date: searchDate, name: savedName() } }); })
      .then(function (msg) {
        if (!msg) throw new Error("empty response");
        if (msg.error) throw new Error(msg.error.message || "mcp error");
        var info = render(textOf(msg.result));
        updatePager(info);
        restoreScroll(anchor);
        if (isSearching()) {
          showUnreadSummary(0, 0);
          showNewMessage("↓ 回到最新消息");
        } else if (currentPage === 1) {
          if (savedReadId() === null) saveReadId(info.newestId);
          showUnreadSummary(info.unread, info.mentionedUnread);
          if (anchor.bottom || forceBottom) saveReadId(info.newestId);
          if (rendered && !anchor.bottom && info.newestId > previousLastId) showNewMessage("↓ 有新消息");
          else if (anchor.bottom || forceBottom) hideNewMessage();
          lastMessageId = Math.max(lastMessageId, info.newestId);
        } else {
          showUnreadSummary(0, 0);
          showNewMessage("↓ 回到最新消息");
        }
        rendered = true;
        forceBottom = false;
        setStatus(true, "刚看过 · 共 " + info.total + " 条 · " + new Date().toLocaleTimeString("zh-CN", { hour12: false }));
      })
      .catch(function (err) {
        sessionId = null;
        setStatus(false, "读不到黑板：" + (err && err.message ? err.message : err));
      });
  }

  // ---- 写上去 ----
  function send() {
    var sayEl = $("say"), btn = $("send");
    var name = savedName();
    var text = (sayEl.value || "").trim();
    var mentions = mentionsIn(text);
    if (!name) { editIdentity(); return; }
    if (!text) { setHint("还没写字呢", true); sayEl.focus(); return; }

    btn.disabled = true;
    setHint("正在写…", false);
    ensureSession()
      .then(function () {
        return rpc("tools/call", { name: "room_say", arguments: { name: name, text: text, mentions: mentions, reply_to: replyTo } });
      })
      .then(function (msg) {
        if (!msg) throw new Error("empty response");
        if (msg.error) throw new Error(msg.error.message || "mcp error");
        sayEl.value = "";
        saveDraft();
        clearReply();
        $("mentionMenu").hidden = true;
        setHint("写上去了 ✓", false);
        sessionId = sessionId; // 保留会话
        currentPage = 1;
        forceBottom = true;
        refresh();
      })
      .catch(function (err) {
        sessionId = null;
        setHint("没写上去：" + (err && err.message ? err.message : err), true);
      })
      .then(function () { btn.disabled = false; });
  }

  var initialName = savedName();
  restoreDraft();
  if (initialName) showIdentity(initialName);
  else editIdentity();

  $("send").addEventListener("click", send);
  $("saveName").addEventListener("click", saveIdentity);
  $("changeName").addEventListener("click", editIdentity);
  $("cancelName").addEventListener("click", function () { showIdentity(savedName()); });
  $("cancelReply").addEventListener("click", clearReply);
  $("search").addEventListener("click", applySearch);
  $("resetSearch").addEventListener("click", clearSearch);
  $("searchKeyword").addEventListener("keydown", function (event) {
    if (event.key === "Enter") { event.preventDefault(); applySearch(); }
  });
  $("log").addEventListener("click", function (event) {
    var replyButton = event.target.closest("[data-reply]");
    if (replyButton) { beginReply(replyButton.getAttribute("data-reply")); return; }
    var quote = event.target.closest("[data-quote]");
    if (!quote) return;
    var target = $("log").querySelector('.msg[data-id="' + quote.getAttribute("data-quote") + '"]');
    if (target) {
      target.scrollIntoView({ block: "center", behavior: "smooth" });
      target.classList.remove("flash");
      void target.offsetWidth;
      target.classList.add("flash");
    }
  });
  $("say").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); send(); }
    if (ev.key === "Escape") $("mentionMenu").hidden = true;
  });
  $("say").addEventListener("input", function () { updateMentionMenu(); saveDraft(); });
  $("say").addEventListener("click", updateMentionMenu);
  $("who").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") { ev.preventDefault(); saveIdentity(); }
  });
  $("newer").addEventListener("click", function () {
    if (currentPage > 1) { currentPage--; forceBottom = true; refresh(); }
  });
  $("older").addEventListener("click", function () {
    if (currentPage < totalPages) { currentPage++; forceBottom = true; refresh(); }
  });
  $("log").addEventListener("scroll", function () {
    if (currentPage === 1 && isAtBottom()) {
      hideNewMessage();
      saveReadId(lastMessageId);
      showUnreadSummary(0, 0);
    }
  });
  $("unreadSummary").addEventListener("click", function () {
    $("log").scrollTop = $("log").scrollHeight;
    saveReadId(lastMessageId);
    showUnreadSummary(0, 0);
  });
  $("newMessage").addEventListener("click", function () {
    if (isSearching()) { clearSearch(); return; }
    currentPage = 1;
    forceBottom = true;
    hideNewMessage();
    refresh();
  });

  refresh();
  setInterval(function () { if (currentPage === 1 && !isSearching()) refresh(); }, REFRESH_MS);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && currentPage === 1 && !isSearching()) refresh();
  });
})();
</script>
</body>
</html>
